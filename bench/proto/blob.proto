// Larger, structured message for the benchmark size sweep (~1KB/10KB/100KB).
// Separate from the example protos so its generous size limits do not affect
// the example/app defaults. Used by bench/js-bench.mjs and bench/native-bench.cpp.
//
// Field order matters for nanopb static layout: the two large fields (text,
// data) are declared LAST so every field's struct offset stays < 65536.
syntax = "proto3";
package acme;

message Item {
  string k = 1;
  uint32 v = 2;
}

message Blob {
  repeated Item items = 1;  // repeated nested message
  repeated string tags = 2; // repeated string
  string text = 3;          // long string
  bytes data = 4;           // long byte array (number[] / base64 in JS)
}
