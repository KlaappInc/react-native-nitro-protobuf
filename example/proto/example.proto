syntax = "proto3";
package acme;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";

message Address {
  string street = 1;
  uint32 zip = 2;
}

// Exercises the well-known-type mapping (Timestamp <-> Date/ISO, Duration <-> ms).
message Session {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Duration ttl = 3;
  google.protobuf.FieldMask mask = 4;
  repeated google.protobuf.Timestamp checkpoints = 5;
}

message User {
  uint32 id = 1;
  string name = 2;
  bytes avatar = 3;
  repeated int32 scores = 4;
  bool active = 5;
  Address address = 6;
  repeated string tags = 7;
  int64 delta = 8;
  uint64 big = 9;
  float ratio = 10;
  double weight = 11;
}

// Exercises oneof + map<K,V>.
message Shape {
  uint32 id = 1;
  oneof kind {
    string label = 2;
    int32 count = 3;
    Address spot = 4;
  }
  map<string, int32> tally = 5;
  map<string, Address> places = 6;
}
