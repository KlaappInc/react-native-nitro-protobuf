syntax = "proto3";
package acme;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";

message Address {
  string street = 1;
  uint32 zip = 2;
}

// Exercises the well-known-type mapping (Timestamp <-> Date/ISO, Duration <-> ms).
message Session {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Duration ttl = 3;
  google.protobuf.FieldMask mask = 4;
  repeated google.protobuf.Timestamp checkpoints = 5;
}

message User {
  uint32 id = 1;
  string name = 2;
  bytes avatar = 3;
  repeated int32 scores = 4;
  bool active = 5;
  Address address = 6;
  repeated string tags = 7;
  int64 delta = 8;
  uint64 big = 9;
  float ratio = 10;
  double weight = 11;
}

// Exercises oneof + map<K,V>.
message Shape {
  uint32 id = 1;
  oneof kind {
    string label = 2;
    int32 count = 3;
    Address spot = 4;
  }
  map<string, int32> tally = 5;
  map<string, Address> places = 6;
}

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
  BLUE = 3;
}

// Every proto field type in one message: all 15 scalar types, enum, message,
// repeated (scalar/string/message), maps (string + integer keys), and a oneof.
message AllTypes {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Color f_enum = 16;
  Address f_msg = 17;

  repeated int32 r_int32 = 18;
  repeated string r_string = 19;
  repeated Address r_msg = 20;

  map<string, int32> m_string_int = 21;
  map<int32, string> m_int_string = 22;

  oneof choice {
    string o_string = 23;
    int32 o_int = 24;
  }
}
